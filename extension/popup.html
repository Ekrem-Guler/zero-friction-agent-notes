<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroNote</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <textarea
        id="noteInput"
        rows="3"
        maxlength="500"
        placeholder="Quick note... (Enter to save)"
        autofocus
      ></textarea>

      <div id="statusLine" class="status hidden"></div>

      <div class="bar">
        <div class="left">
          <select id="projectSelect" title="Project">
            <option value="default">General</option>
          </select>
          <span id="charCount" class="count">0/500</span>
        </div>

        <div class="right">
          <button
            id="settingsBtn"
            type="button"
            class="icon-btn"
            title="Server Settings"
            aria-label="Server Settings"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>

          <button
            id="sendBtn"
            type="button"
            class="send-btn"
            title="Save Note (Enter)"
            disabled
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"></path>
              <path d="m5 12 7-7 7 7"></path>
            </svg>
          </button>
        </div>
      </div>

      <section id="settingsPanel" class="settings hidden">
        <label class="field">
          <span>Server URL</span>
          <input id="serverUrlInput" type="url" placeholder="http://localhost:3000" />
        </label>
        <label class="field">
          <span>App Password (if enabled)</span>
          <input id="passwordInput" type="password" placeholder="Optional" />
        </label>
        <div class="settings-actions">
          <button id="saveSettingsBtn" type="button" class="save-settings-btn">
            Save
          </button>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
